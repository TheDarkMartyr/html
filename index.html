<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weboldal blokkolva</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #c0392b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 1.5rem 2rem 1.5rem;
        }

        .container {
            max-width: 600px;
            margin: auto 0;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 1.5rem;
            word-break: break-word;
        }

        .domain-name {
            font-weight: 800;
            text-decoration: underline;
            text-decoration-thickness: 3px;
            text-underline-offset: 4px;
        }

        .description {
            font-size: 1.15rem;
            line-height: 1.5;
            opacity: 0.95;
            margin-bottom: 2.5rem;
        }

        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 2rem;
        }

        .shield-icon {
            width: 32px;
            height: 32px;
            fill: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>A(z) <span id="domain" class="domain-name">weboldal</span> blokkolva lett</h1>
        
        <p class="description">
            A meglátogatni kívánt weboldalt a hálózatért felelős rendszergazda vagy a biztonsági szűrő letiltotta.
        </p>
    </div>

    <div class="footer">
        <!-- Védelmi pajzs ikon -->
        <svg class="shield-icon" viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.81z"/>
        </svg>
    </div>

    <script>
        // Automatikusan lekéri a megnyitott domain nevet az URL-ből vagy a címsorból
        function getDomainName() {
            const urlParams = new URLSearchParams(window.location.search);
            const paramDomain = urlParams.get('domain');
            
            if (paramDomain) {
                return paramDomain;
            }
            
            // Ha nincsen paraméter, a hostnevet használja
            return window.location.hostname || 'kotor.neocities.org';
        }

        const domain = getDomainName();
        document.getElementById('domain').innerText = domain;
    </script>
</body>
</html>
